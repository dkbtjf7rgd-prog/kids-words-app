<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <h1>📚 Kids Words - Тест</h1>
    <div id="status">Проверка подключения...</div>
    <div id="users"></div>

    <script>
        // ============================================================
        // ВАШИ ДАННЫЕ
        // ============================================================
        const SUPABASE_URL = 'https://lcphvftkjgsclcqpkegd.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcGh2ZnRramdzY2xjcXBrZWdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTkzOTMsImV4cCI6MjEwMTY3NTM5M30.0QvBp9g56UQ5R_5qoS6FlMsHSkPh-rEzO2TfB7DPNmk';
        // ============================================================

        const sb = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function testConnection() {
            const status = document.getElementById('status');
            const usersDiv = document.getElementById('users');

            try {
                // Проверяем таблицу users
                const { data, error } = await sb
                    .from('users')
                    .select('*')
                    .limit(5);

                if (error) {
                    status.textContent = '❌ Ошибка: ' + error.message;
                    status.style.color = 'red';
                    usersDiv.innerHTML = '<p>Ошибка: ' + error.message + '</p>';
                    console.error('Ошибка Supabase:', error);
                    return;
                }

                status.textContent = '✅ Подключение работает!';
                status.style.color = 'green';

                if (data && data.length > 0) {
                    usersDiv.innerHTML = '<strong>Пользователи в базе:</strong><br>' +
                        data.map(u => u.name + ' (@' + u.username + ')').join('<br>');
                } else {
                    usersDiv.innerHTML = '⚠️ В таблице "users" пока нет данных. Зарегистрируйтесь через приложение.';
                }

            } catch (e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                status.style.color = 'red';
                console.error('Ошибка:', e);
            }
        }

        testConnection();
    </script>
</body>
</html>

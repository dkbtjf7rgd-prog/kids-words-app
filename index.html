<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Words</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 28px; }
        .header p { color: #888; }
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .btn-primary { background: #4A90D9; color: white; }
        .btn-outline { background: transparent; color: #4A90D9; border: 2px solid #4A90D9; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card .dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
        .card .name { flex: 1; font-weight: 600; }
        .card .count { font-size: 13px; color: #999; background: #f0f0f0; padding: 2px 10px; border-radius: 20px; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .avatar-selector { display: flex; gap: 12px; font-size: 28px; flex-wrap: wrap; }
        .avatar-selector span { cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent; }
        .avatar-selector span.active { border-color: #4A90D9; background: rgba(74,144,217,0.1); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 2000; max-width: 90%; text-align: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 24px; max-width: 420px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-close { float: right; background: none; border: none; font-size: 24px; cursor: pointer; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📚 Kids Words</h1>
            <p>Учим английские слова легко и весело</p>
        </div>

        <!-- AUTH SCREEN -->
        <div id="auth-screen">
            <div id="login-form">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="login-username" placeholder="Введите имя">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">🚀 Войти</button>
                <button class="btn btn-outline" onclick="showRegister()">📝 Зарегистрироваться</button>
            </div>

            <div id="register-form" class="hidden">
                <div class="form-group">
                    <label>Имя пользователя (уникальное)</label>
                    <input type="text" id="reg-username" placeholder="Например: ivan">
                </div>
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Например: Иван">
                </div>
                <div class="form-group">
                    <label>Выберите аватар</label>
                    <div class="avatar-selector">
                        <span class="active" onclick="selectAvatar(this)">🧒</span>
                        <span onclick="selectAvatar(this)">👦</span>
                        <span onclick="selectAvatar(this)">👧</span>
                        <span onclick="selectAvatar(this)">👶</span>
                        <span onclick="selectAvatar(this)">🦊</span>
                        <span onclick="selectAvatar(this)">🐱</span>
                    </div>
                    <input type="hidden" id="reg-avatar" value="🧒">
                </div>
                <button class="btn btn-primary" onclick="handleRegister()">✅ Создать аккаунт</button>
                <button class="btn btn-outline" onclick="showLogin()">← Уже есть аккаунт?</button>
            </div>
        </div>

        <!-- APP SCREEN -->
        <div id="app-screen" class="hidden">
            <div class="flex-between" style="background:white; border-radius:16px; padding:12px 16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                <span id="user-avatar" style="font-size:32px;">🧒</span>
                <span id="user-name" style="font-weight:600;">Имя</span>
                <span id="user-points" style="color:#FFB347;">⭐ 0</span>
                <button onclick="logoutUser()" style="background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer;">🚪</button>
            </div>
            <div id="content">
                <h3>📚 Ваши категории</h3>
                <button class="btn btn-primary mb-16" onclick="showCreateCategoryModal()">➕ Создать категорию</button>
                <div id="categories-list"></div>
            </div>
        </div>

        <!-- MODAL -->
        <div id="modal" class="modal-overlay hidden">
            <div class="modal-content" id="modal-body"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. SUPABASE CONFIG
        // ============================================================
        const SUPABASE_URL = 'https://lcphvftkjgsclcqpkegd.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcGh2ZnRramdzY2xjcXBrZWdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTkzOTMsImV4cCI6MjEwMTY3NTM5M30.0QvBp9g56UQ5R_5qoS6FlMsHSkPh-rEzO2TfB7DPNmk';
        // ============================================================

        // ============================================================
        // 0.5. БАЗОВЫЙ HTTP-КЛИЕНТ ДЛЯ SUPABASE
        // ============================================================
        const sb = {
            from: (table) => {
                return {
                    select: (columns = '*') => {
                        return {
                            eq: (column, value) => {
                                return {
                                    maybeSingle: async () => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?${column}=eq.${encodeURIComponent(value)}`;
                                            const response = await fetch(url, {
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                                }
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                return { data: null, error: null };
                                            }
                                            const data = JSON.parse(text);
                                            if (response.ok) {
                                                return { data: data.length ? data[0] : null, error: null };
                                            } else {
                                                return { data: null, error: data };
                                            }
                                        } catch (e) {
                                            return { data: null, error: { message: e.message } };
                                        }
                                    },
                                    single: async () => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?${column}=eq.${encodeURIComponent(value)}`;
                                            const response = await fetch(url, {
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                                }
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                return { data: null, error: null };
                                            }
                                            const data = JSON.parse(text);
                                            if (response.ok && data.length) {
                                                return { data: data[0], error: null };
                                            } else {
                                                return { data: null, error: data };
                                            }
                                        } catch (e) {
                                            return { data: null, error: { message: e.message } };
                                        }
                                    }
                                };
                            },
                            or: (filters) => {
                                return {
                                    maybeSingle: async () => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?or=(${filters})`;
                                            const response = await fetch(url, {
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                                }
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                return { data: null, error: null };
                                            }
                                            const data = JSON.parse(text);
                                            if (response.ok) {
                                                return { data: data.length ? data[0] : null, error: null };
                                            } else {
                                                return { data: null, error: data };
                                            }
                                        } catch (e) {
                                            return { data: null, error: { message: e.message } };
                                        }
                                    },
                                    single: async () => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?or=(${filters})`;
                                            const response = await fetch(url, {
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                                }
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                return { data: null, error: null };
                                            }
                                            const data = JSON.parse(text);
                                            if (response.ok && data.length) {
                                                return { data: data[0], error: null };
                                            } else {
                                                return { data: null, error: data };
                                            }
                                        } catch (e) {
                                            return { data: null, error: { message: e.message } };
                                        }
                                    }
                                };
                            },
                            then: async (resolve) => {
                                try {
                                    const response = await fetch(`${SUPABASE_URL}${table}`, {
                                        headers: {
                                            'apikey': SUPABASE_KEY,
                                            'Authorization': `Bearer ${SUPABASE_KEY}`
                                        }
                                    });
                                    const text = await response.text();
                                    if (!text || text.trim() === '') {
                                        resolve({ data: [], error: null });
                                        return;
                                    }
                                    const data = JSON.parse(text);
                                    if (response.ok) {
                                        resolve({ data, error: null });
                                    } else {
                                        resolve({ data: null, error: data });
                                    }
                                } catch (e) {
                                    resolve({ data: null, error: { message: e.message } });
                                }
                            }
                        };
                    },
                    insert: (data) => {
                        return {
                            select: () => {
                                return {
                                    single: async () => {
                                        try {
                                            const response = await fetch(`${SUPABASE_URL}${table}`, {
                                                method: 'POST',
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                                                    'Content-Type': 'application/json'
                                                },
                                                body: JSON.stringify(data)
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                return { data: null, error: null };
                                            }
                                            const result = JSON.parse(text);
                                            if (response.ok) {
                                                return { data: result.length ? result[0] : result, error: null };
                                            } else {
                                                return { data: null, error: result };
                                            }
                                        } catch (e) {
                                            return { data: null, error: { message: e.message } };
                                        }
                                    }
                                };
                            },
                            then: async (resolve) => {
                                try {
                                    const response = await fetch(`${SUPABASE_URL}${table}`, {
                                        method: 'POST',
                                        headers: {
                                            'apikey': SUPABASE_KEY,
                                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(data)
                                    });
                                    const text = await response.text();
                                    if (!text || text.trim() === '') {
                                        resolve({ data: [], error: null });
                                        return;
                                    }
                                    const result = JSON.parse(text);
                                    if (response.ok) {
                                        resolve({ data: result, error: null });
                                    } else {
                                        resolve({ data: null, error: result });
                                    }
                                } catch (e) {
                                    resolve({ data: null, error: { message: e.message } });
                                }
                            }
                        };
                    },
                    delete: () => {
                        return {
                            eq: (column, value) => {
                                return {
                                    then: async (resolve) => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?${column}=eq.${encodeURIComponent(value)}`;
                                            const response = await fetch(url, {
                                                method: 'DELETE',
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                                }
                                            });
                                            if (response.ok) {
                                                resolve({ data: { success: true }, error: null });
                                            } else {
                                                const text = await response.text();
                                                const error = text ? JSON.parse(text) : { message: 'Ошибка удаления' };
                                                resolve({ data: null, error });
                                            }
                                        } catch (e) {
                                            resolve({ data: null, error: { message: e.message } });
                                        }
                                    }
                                };
                            }
                        };
                    },
                    update: (data) => {
                        return {
                            eq: (column, value) => {
                                return {
                                    then: async (resolve) => {
                                        try {
                                            const url = `${SUPABASE_URL}${table}?${column}=eq.${encodeURIComponent(value)}`;
                                            const response = await fetch(url, {
                                                method: 'PATCH',
                                                headers: {
                                                    'apikey': SUPABASE_KEY,
                                                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                                                    'Content-Type': 'application/json'
                                                },
                                                body: JSON.stringify(data)
                                            });
                                            const text = await response.text();
                                            if (!text || text.trim() === '') {
                                                resolve({ data: { success: true }, error: null });
                                                return;
                                            }
                                            const result = JSON.parse(text);
                                            if (response.ok) {
                                                resolve({ data: result, error: null });
                                            } else {
                                                resolve({ data: null, error: result });
                                            }
                                        } catch (e) {
                                            resolve({ data: null, error: { message: e.message } });
                                        }
                                    }
                                };
                            }
                        };
                    }
                };
            },
            rpc: (fn, params) => {
                return {
                    then: async (resolve) => {
                        try {
                            const response = await fetch(`${SUPABASE_URL}rpc/${fn}`, {
                                method: 'POST',
                                headers: {
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(params)
                            });
                            const text = await response.text();
                            if (!text || text.trim() === '') {
                                resolve({ data: null, error: null });
                                return;
                            }
                            const data = JSON.parse(text);
                            if (response.ok) {
                                resolve({ data, error: null });
                            } else {
                                resolve({ data: null, error: data });
                            }
                        } catch (e) {
                            resolve({ data: null, error: { message: e.message } });
                        }
                    }
                };
            }
        };

        // ============================================================
        // 1. AUTH FUNCTIONS
        // ============================================================
        let currentUser = null;

        async function registerUser(username, name, avatar) {
            console.log('📝 Регистрация:', username);
            try {
                // Проверяем, есть ли пользователь
                const existing = await sb.from('users').select('id').eq('username', username).maybeSingle();
                if (existing.data) {
                    showToast('❌ Пользователь с таким именем уже существует');
                    return false;
                }
                // Создаём нового пользователя
                const result = await sb.from('users').insert([{ username, name, avatar }]).select().single();
                if (result.error) {
                    showToast('❌ Ошибка регистрации: ' + JSON.stringify(result.error));
                    console.error('Детали ошибки:', result.error);
                    return false;
                }
                currentUser = result.data;
                localStorage.setItem('currentUserId', currentUser.id);
                renderApp();
                showToast('✅ Добро пожаловать, ' + currentUser.name + '!');
                return true;
            } catch (e) {
                console.error('Исключение при регистрации:', e);
                showToast('❌ Ошибка: ' + e.message);
                return false;
            }
        }

        async function loginUser(username) {
            console.log('🔑 Вход:', username);
            try {
                const result = await sb.from('users').select('*').eq('username', username).single();
                if (result.error || !result.data) {
                    showToast('❌ Пользователь не найден');
                    return false;
                }
                currentUser = result.data;
                localStorage.setItem('currentUserId', currentUser.id);
                renderApp();
                showToast('👋 Привет, ' + currentUser.name + '!');
                return true;
            } catch (e) {
                console.error('Ошибка входа:', e);
                showToast('❌ Ошибка: ' + e.message);
                return false;
            }
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('currentUserId');
            renderApp();
            showToast('👋 До свидания!');
        }

        async function checkSavedUser() {
            const userId = localStorage.getItem('currentUserId');
            if (!userId) return false;
            try {
                const result = await sb.from('users').select('*').eq('id', userId).single();
                if (result.data) {
                    currentUser = result.data;
                    return true;
                }
                return false;
            } catch (e) {
                console.error('Ошибка проверки:', e);
                return false;
            }
        }

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }
        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
        }

        function selectAvatar(el) {
            document.querySelectorAll('.avatar-selector span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('reg-avatar').value = el.textContent;
        }

        function handleLogin() {
            console.log('✅ Кнопка "Войти" нажата');
            const username = document.getElementById('login-username').value.trim();
            if (!username) { showToast('Введите имя пользователя'); return; }
            loginUser(username);
        }

        function handleRegister() {
            console.log('✅ Кнопка "Создать аккаунт" нажата');
            const username = document.getElementById('reg-username').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const avatar = document.getElementById('reg-avatar').value;
            if (!username || !name) { showToast('Заполните все поля'); return; }
            registerUser(username, name, avatar);
        }

        // ============================================================
        // 2. RENDER
        // ============================================================
        function renderApp() {
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');
            if (!currentUser) {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                return;
            }
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            document.getElementById('user-avatar').textContent = currentUser.avatar || '🧒';
            document.getElementById('user-name').textContent = currentUser.name || 'Имя';
            document.getElementById('user-points').textContent = '⭐ ' + (currentUser.total_points || 0);
            loadCategories();
        }

        // ============================================================
        // 3. CATEGORIES
        // ============================================================
        async function loadCategories() {
            if (!currentUser) return;
            try {
                const result = await sb.from('categories').select('*, words(*)').or(`user_id.eq.${currentUser.id},is_public.eq.true`);
                if (result.error) {
                    console.error('Ошибка загрузки категорий:', result.error);
                    return;
                }
                const data = result.data || [];
                const container = document.getElementById('categories-list');
                if (!data.length) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">📂</div><div class="text-center">Нет категорий. Создайте первую!</div></div>';
                    return;
                }
                container.innerHTML = data.map(cat => `
                    <div class="card">
                        <div class="flex">
                            <span class="dot" style="background:${cat.color || '#4A90D9'};"></span>
                            <span class="name">${cat.name}</span>
                            <span class="count">${cat.words ? cat.words.length : 0}</span>
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" style="background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer;">✕</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Ошибка загрузки категорий:', e);
            }
        }

        // ============================================================
        // 4. CATEGORY CRUD
        // ============================================================
        async function createCategory(name, color) {
            if (!currentUser) return;
            try {
                const result = await sb.from('categories').insert([{
                    user_id: currentUser.id,
                    name: name,
                    color: color || '#4A90D9',
                    is_public: false
                }]).select().single();
                if (result.error) {
                    showToast('❌ Ошибка: ' + JSON.stringify(result.error));
                    return;
                }
                showToast('✅ Категория создана');
                loadCategories();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Удалить категорию?')) return;
            try {
                const result = await sb.from('categories').delete().eq('id', id);
                if (result.error) {
                    showToast('❌ Ошибка: ' + JSON.stringify(result.error));
                    return;
                }
                showToast('🗑️ Категория удалена');
                loadCategories();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        // ============================================================
        // 5. MODAL
        // ============================================================
        function showModal(html) {
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function showCreateCategoryModal() {
            showModal(`
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center; margin-bottom:16px;">📂 Новая категория</h3>
                <div class="form-group">
                    <label>Название категории</label>
                    <input type="text" id="new-cat-name" placeholder="Например: Животные">
                </div>
                <button class="btn btn-primary" onclick="handleCreateCategory()">Создать</button>
            `);
        }

        function handleCreateCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) { showToast('Введите название'); return; }
            createCategory(name);
            closeModal();
        }

        // ============================================================
        // 6. TOAST
        // ============================================================
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================================
        // 7. INIT
        // ============================================================
        checkSavedUser().then(() => {
            renderApp();
            console.log('✅ Kids Words App готов!');
        });
    </script>
</body>

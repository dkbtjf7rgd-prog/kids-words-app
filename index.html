<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Words</title>
    <!-- ✅ ПОДКЛЮЧАЕМ БИБЛИОТЕКУ ПЕРВОЙ -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div id="app" style="max-width: 480px; margin: 0 auto; padding: 20px; font-family: -apple-system, sans-serif;">
        <h1 style="text-align: center;">📚 Kids Words</h1>
        <p style="text-align: center; color: #888;">Учим английские слова легко и весело</p>
        
        <div id="auth-screen">
            <div id="login-form">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Имя пользователя</label>
                    <input type="text" id="login-username" placeholder="Введите имя" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px;">
                </div>
                <button onclick="handleLogin()" style="width: 100%; padding: 12px; background: #4A90D9; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">🚀 Войти</button>
                <button onclick="showRegister()" style="width: 100%; margin-top: 8px; padding: 12px; background: transparent; color: #4A90D9; border: 2px solid #4A90D9; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">📝 Зарегистрироваться</button>
            </div>

            <div id="register-form" style="display: none;">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Имя пользователя (уникальное)</label>
                    <input type="text" id="reg-username" placeholder="Например: ivan" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Например: Иван" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Выберите аватар</label>
                    <div style="display: flex; gap: 12px; font-size: 28px;">
                        <span onclick="selectAvatar(this)" style="cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid #4A90D9;">🧒</span>
                        <span onclick="selectAvatar(this)" style="cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent;">👦</span>
                        <span onclick="selectAvatar(this)" style="cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent;">👧</span>
                        <span onclick="selectAvatar(this)" style="cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent;">👶</span>
                        <span onclick="selectAvatar(this)" style="cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent;">🦊</span>
                    </div>
                    <input type="hidden" id="reg-avatar" value="🧒">
                </div>
                <button onclick="handleRegister()" style="width: 100%; padding: 12px; background: #4A90D9; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">✅ Создать аккаунт</button>
                <button onclick="showLogin()" style="width: 100%; margin-top: 8px; padding: 12px; background: transparent; color: #4A90D9; border: 2px solid #4A90D9; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">← Уже есть аккаунт?</button>
            </div>
        </div>

        <div id="app-screen" style="display: none;">
            <div id="user-info" style="display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                <span id="user-avatar" style="font-size: 32px;">🧒</span>
                <span id="user-name" style="font-weight: 600;">Имя</span>
                <span id="user-points" style="color: #FFB347;">⭐ 0</span>
                <button onclick="logoutUser()" style="background: none; border: none; color: #ff6b6b; font-size: 18px; cursor: pointer;">🚪</button>
            </div>
            <div id="content">
                <h3>📚 Ваши категории</h3>
                <button onclick="showCreateCategoryModal()" style="width: 100%; padding: 12px; background: #4A90D9; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 16px;">➕ Создать категорию</button>
                <div id="categories-list"></div>
            </div>
        </div>
    </div>

    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 24px; padding: 24px; max-width: 420px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. SUPABASE CONFIG - ВСТАВЬТЕ ВАШИ ДАННЫЕ!
        // ============================================================
        const SUPABASE_URL = 'https://lcphvftkjgsclcqpkegd.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcGh2ZnRramdzY2xjcXBrZWdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTkzOTMsImV4cCI6MjEwMTY3NTM5M30.0QvBp9g56UQ5R_5qoS6FlMsHSkPh-rEzO2TfB7DPNmk';
        // ============================================================

        // ✅ СОЗДАЁМ КЛИЕНТ ДО ВСЕХ ФУНКЦИЙ
        const sb = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        // ============================================================
        // 1. AUTH
        // ============================================================
        async function registerUser(username, name, avatar) {
            console.log('📝 Регистрация:', username);
            const { data: existing } = await sb.from('users').select('id').eq('username', username).maybeSingle();
            if (existing) { showToast('❌ Пользователь с таким именем уже существует'); return false; }
            const { data, error } = await sb.from('users').insert([{ username, name, avatar }]).select().single();
            if (error) { showToast('❌ Ошибка регистрации: ' + error.message); return false; }
            currentUser = data;
            localStorage.setItem('currentUserId', data.id);
            renderApp();
            showToast('✅ Добро пожаловать, ' + data.name + '!');
            return true;
        }

        async function loginUser(username) {
            console.log('🔑 Вход:', username);
            const { data, error } = await sb.from('users').select('*').eq('username', username).maybeSingle();
            if (error || !data) { showToast('❌ Пользователь не найден'); return false; }
            currentUser = data;
            localStorage.setItem('currentUserId', data.id);
            renderApp();
            showToast('👋 Привет, ' + data.name + '!');
            return true;
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('currentUserId');
            renderApp();
            showToast('👋 До свидания!');
        }

        async function checkSavedUser() {
            const userId = localStorage.getItem('currentUserId');
            if (!userId) return false;
            const { data, error } = await sb.from('users').select('*').eq('id', userId).maybeSingle();
            if (data && !error) { currentUser = data; return true; }
            return false;
        }

        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        }

        function selectAvatar(el) {
            document.querySelectorAll('#register-form span').forEach(s => s.style.borderColor = 'transparent');
            el.style.borderColor = '#4A90D9';
            document.getElementById('reg-avatar').value = el.textContent;
        }

        async function handleLogin() {
            console.log('✅ Кнопка "Войти" нажата');
            const username = document.getElementById('login-username').value.trim();
            if (!username) { showToast('Введите имя пользователя'); return; }
            await loginUser(username);
        }

        async function handleRegister() {
            console.log('✅ Кнопка "Создать аккаунт" нажата');
            const username = document.getElementById('reg-username').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const avatar = document.getElementById('reg-avatar').value;
            if (!username || !name) { showToast('Заполните все поля'); return; }
            await registerUser(username, name, avatar);
        }

        // ============================================================
        // 2. RENDER
        // ============================================================
        function renderApp() {
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');
            if (!currentUser) {
                authScreen.style.display = 'block';
                appScreen.style.display = 'none';
                return;
            }
            authScreen.style.display = 'none';
            appScreen.style.display = 'block';
            document.getElementById('user-avatar').textContent = currentUser.avatar || '🧒';
            document.getElementById('user-name').textContent = currentUser.name || 'Имя';
            document.getElementById('user-points').textContent = '⭐ ' + (currentUser.total_points || 0);
            loadCategories();
        }

        // ============================================================
        // 3. CATEGORIES
        // ============================================================
        async function loadCategories() {
            if (!currentUser) return;
            const { data, error } = await sb.from('categories').select('*, words(*)').or(`user_id.eq.${currentUser.id},is_public.eq.true`);
            if (error) { console.error('Ошибка загрузки категорий:', error); return; }
            const container = document.getElementById('categories-list');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">Нет категорий. Создайте первую!</p>';
                return;
            }
            container.innerHTML = data.map(cat => `
                <div style="background:white; border-radius:16px; padding:16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <span style="display:flex; align-items:center; gap:12px;">
                        <span style="width:14px; height:14px; border-radius:50%; background:${cat.color || '#4A90D9'};"></span>
                        <span style="font-weight:600;">${cat.name}</span>
                        <span style="font-size:13px; color:#999; background:#f0f0f0; padding:2px 10px; border-radius:20px;">${cat.words ? cat.words.length : 0}</span>
                    </span>
                    <span>
                        <button onclick="deleteCategory('${cat.id}')" style="background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer;">✕</button>
                    </span>
                </div>
            `).join('');
        }

        // ============================================================
        // 4. CREATE / DELETE CATEGORY
        // ============================================================
        async function createCategory(name, color) {
            if (!currentUser) return;
            const { error } = await sb.from('categories').insert([{ user_id: currentUser.id, name, color: color || '#4A90D9', is_public: false }]);
            if (error) { showToast('❌ Ошибка: ' + error.message); return; }
            showToast('✅ Категория создана');
            loadCategories();
        }

        async function deleteCategory(id) {
            if (!confirm('Удалить категорию?')) return;
            const { error } = await sb.from('categories').delete().eq('id', id);
            if (error) { showToast('❌ Ошибка: ' + error.message); return; }
            showToast('🗑️ Категория удалена');
            loadCategories();
        }

        // ============================================================
        // 5. MODAL
        // ============================================================
        function showModal(html) {
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showCreateCategoryModal() {
            showModal(`
                <button onclick="closeModal()" style="float:right; background:none; border:none; font-size:24px; cursor:pointer;">✕</button>
                <h3 style="text-align:center; margin-bottom:16px;">📂 Новая категория</h3>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Название</label>
                    <input type="text" id="new-cat-name" placeholder="Например: Животные" style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:12px; font-size:16px;">
                </div>
                <button onclick="handleCreateCategory()" style="width:100%; padding:12px; background:#4A90D9; color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer;">Создать</button>
            `);
        }

        async function handleCreateCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) { showToast('Введите название'); return; }
            await createCategory(name);
            closeModal();
        }

        // ============================================================
        // 6. TOAST
        // ============================================================
        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:12px 24px; border-radius:12px; font-size:14px; z-index:2000; max-width:90%; text-align:center; animation:fadeIn 0.3s ease;';
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        // ============================================================
        // 7. INIT
        // ============================================================
        checkSavedUser().then(() => renderApp());
        console.log('📚 Kids Words App готов!');
    </script>
</body>
</html>

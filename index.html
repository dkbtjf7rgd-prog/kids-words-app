<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Words</title>
    <script src="https://https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 28px; }
        .header p { color: #888; }
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .btn-primary { background: #4A90D9; color: white; }
        .btn-outline { background: transparent; color: #4A90D9; border: 2px solid #4A90D9; }
        .btn-success { background: #34C759; color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card .dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
        .card .name { flex: 1; font-weight: 600; }
        .card .count { font-size: 13px; color: #999; background: #f0f0f0; padding: 2px 10px; border-radius: 20px; }
        .badge { font-size: 10px; background: #4A90D9; color: white; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .avatar-selector { display: flex; gap: 12px; font-size: 28px; flex-wrap: wrap; }
        .avatar-selector span { cursor: pointer; padding: 8px; border-radius: 50%; border: 3px solid transparent; }
        .avatar-selector span.active { border-color: #4A90D9; background: rgba(74,144,217,0.1); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 2000; max-width: 90%; text-align: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 24px; max-width: 420px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-close { float: right; background: none; border: none; font-size: 24px; cursor: pointer; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Kids Words</h1>
            <p>Учим английские слова легко и весело</p>
        </div>

        <!-- ===== AUTH SCREEN ===== -->
        <div id="auth-screen">
            <div id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="ivan@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">🚀 Войти</button>
                <button class="btn btn-outline" onclick="showRegister()">📝 Зарегистрироваться</button>
            </div>

            <div id="register-form" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="ivan@example.com">
                </div>
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" placeholder="ivan">
                </div>
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Пароль (минимум 6 символов)</label>
                    <input type="password" id="reg-password" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Выберите аватар</label>
                    <div class="avatar-selector">
                        <span class="active" onclick="selectAvatar(this)">🧒</span>
                        <span onclick="selectAvatar(this)">👦</span>
                        <span onclick="selectAvatar(this)">👧</span>
                        <span onclick="selectAvatar(this)">👶</span>
                        <span onclick="selectAvatar(this)">🦊</span>
                        <span onclick="selectAvatar(this)">🐱</span>
                    </div>
                    <input type="hidden" id="reg-avatar" value="🧒">
                </div>
                <button class="btn btn-primary" onclick="handleRegister()">✅ Создать аккаунт</button>
                <button class="btn btn-outline" onclick="showLogin()">← Уже есть аккаунт?</button>
            </div>
        </div>

        <!-- ===== APP SCREEN ===== -->
        <div id="app-screen" class="hidden">
            <div class="flex-between" style="background:white; border-radius:16px; padding:12px 16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                <span id="user-avatar" style="font-size:32px;">🧒</span>
                <span id="user-name" style="font-weight:600;">Имя</span>
                <span id="user-points" style="color:#FFB347;">⭐ 0</span>
                <button onclick="handleLogout()" style="background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer;">🚪</button>
            </div>
            <div id="content">
                <h3>📚 Ваши категории</h3>
                <button class="btn btn-primary mb-16" onclick="showCreateCategoryModal()">➕ Создать категорию</button>
                <div id="categories-list"></div>
            </div>
        </div>

        <!-- ===== MODAL ===== -->
        <div id="modal" class="modal-overlay hidden">
            <div class="modal-content" id="modal-body"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. SUPABASE CONFIG
        // ============================================================
        const SUPABASE_URL = 'https://lcphvftkjgsclcqpkegd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcGh2ZnRramdzY2xjcXBrZWdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTkzOTMsImV4cCI6MjEwMTY3NTM5M30.0QvBp9g56UQ5R_5qoS6FlMsHSkPh-rEzO2TfB7DPNmk';
        // ============================================================

        // Используем другое имя, чтобы не конфликтовать со старой переменной
        const sb = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;
        let currentProfile = null;

        // ============================================================
        // 1. AUTH FUNCTIONS
        // ============================================================

        async function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value;
            const avatar = document.getElementById('reg-avatar').value;

            if (!email || !username || !name || !password) {
                showToast('❌ Заполните все поля');
                return;
            }
            if (password.length < 6) {
                showToast('❌ Пароль должен быть минимум 6 символов');
                return;
            }

            try {
                const { data, error } = await sb.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username,
                            name: name,
                            avatar: avatar
                        }
                    }
                });

                if (error) {
                    showToast('❌ Ошибка регистрации: ' + error.message);
                    return;
                }

                showToast('✅ Проверьте email для подтверждения!');
                showLogin();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showToast('❌ Введите email и пароль');
                return;
            }

            try {
                const { data, error } = await sb.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showToast('❌ Ошибка входа: ' + error.message);
                    return;
                }

                currentUser = data.user;
                await loadProfile();
                renderApp();
                showToast('👋 Привет, ' + (currentProfile?.name || '') + '!');
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        async function handleLogout() {
            await sb.auth.signOut();
            currentUser = null;
            currentProfile = null;
            renderApp();
            showToast('👋 До свидания!');
        }

        async function loadProfile() {
            if (!currentUser) return;
            const { data, error } = await sb
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            if (!error && data) {
                currentProfile = data;
            }
        }

        async function checkSession() {
            const { data } = await sb.auth.getSession();
            if (data?.session) {
                currentUser = data.session.user;
                await loadProfile();
                return true;
            }
            return false;
        }

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }
        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
        }

        function selectAvatar(el) {
            document.querySelectorAll('.avatar-selector span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('reg-avatar').value = el.textContent;
        }

        // ============================================================
        // 2. RENDER
        // ============================================================
        function renderApp() {
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');

            if (!currentUser || !currentProfile) {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                return;
            }

            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');

            document.getElementById('user-avatar').textContent = currentProfile.avatar || '🧒';
            document.getElementById('user-name').textContent = currentProfile.name || 'Имя';
            document.getElementById('user-points').textContent = '⭐ ' + (currentProfile.total_points || 0);
            loadCategories();
        }

        // ============================================================
        // 3. CATEGORIES
        // ============================================================
        async function loadCategories() {
            if (!currentUser) return;
            try {
                const { data, error } = await sb
                    .from('categories')
                    .select('*, words(*)')
                    .or(`user_id.eq.${currentUser.id},is_public.eq.true`);

                if (error) {
                    console.error('Ошибка загрузки категорий:', error);
                    return;
                }

                const container = document.getElementById('categories-list');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">📂</div><div class="text-center">Нет категорий. Создайте первую!</div></div>';
                    return;
                }

                container.innerHTML = data.map(cat => `
                    <div class="card">
                        <div class="flex">
                            <span class="dot" style="background:${cat.color || '#4A90D9'};"></span>
                            <span class="name">${cat.name}</span>
                            <span class="count">${cat.words ? cat.words.length : 0}</span>
                            ${cat.user_id === currentUser.id ? '<span class="badge">Моя</span>' : '<span class="badge" style="background: #888;">Общая</span>'}
                        </div>
                        ${cat.user_id === currentUser.id ? `<button onclick="deleteCategory('${cat.id}')" style="background:none; border:none; color:#ff6b6b; font-size:18px; cursor:pointer;">✕</button>` : ''}
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // ============================================================
        // 4. CATEGORY CRUD
        // ============================================================
        async function createCategory(name, color) {
            if (!currentUser) return;
            try {
                const { data, error } = await sb
                    .from('categories')
                    .insert([{
                        user_id: currentUser.id,
                        name: name,
                        color: color || '#4A90D9',
                        is_public: false
                    }])
                    .select()
                    .single();

                if (error) {
                    showToast('❌ Ошибка: ' + error.message);
                    return;
                }
                showToast('✅ Категория создана');
                loadCategories();
                setTimeout(() => showAddWordModal(data.id), 300);
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Удалить категорию?')) return;
            try {
                const { error } = await sb
                    .from('categories')
                    .delete()
                    .eq('id', id);

                if (error) {
                    showToast('❌ Ошибка удаления');
                    return;
                }
                showToast('🗑️ Категория удалена');
                loadCategories();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        // ============================================================
        // 5. WORDS
        // ============================================================
        async function addWord(categoryId, original, translation, transcription) {
            if (!currentUser) return;
            try {
                const { error } = await sb
                    .from('words')
                    .insert([{
                        category_id: categoryId,
                        original: original,
                        translation: translation,
                        transcription: transcription || ''
                    }]);

                if (error) {
                    showToast('❌ Ошибка: ' + error.message);
                    return;
                }
                showToast('✅ Слово добавлено');
                loadCategories();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            }
        }

        // ============================================================
        // 6. MODAL
        // ============================================================
        function showModal(html) {
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function showCreateCategoryModal() {
            showModal(`
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center; margin-bottom:16px;">📂 Новая категория</h3>
                <div class="form-group">
                    <label>Название категории</label>
                    <input type="text" id="new-cat-name" placeholder="Например: Животные">
                </div>
                <button class="btn btn-primary" onclick="handleCreateCategory()">Создать</button>
            `);
        }

        function handleCreateCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) { showToast('Введите название'); return; }
            createCategory(name);
            closeModal();
        }

        function showAddWordModal(categoryId) {
            showModal(`
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center; margin-bottom:16px;">➕ Добавить слово в категорию</h3>
                <div class="form-group">
                    <label>Слово (на английском)</label>
                    <input type="text" id="new-word-original" placeholder="cat">
                </div>
                <div class="form-group">
                    <label>Перевод</label>
                    <input type="text" id="new-word-translation" placeholder="кошка">
                </div>
                <div class="form-group">
                    <label>Транскрипция (необязательно)</label>
                    <input type="text" id="new-word-transcription" placeholder="[kæt]">
                </div>
                <button class="btn btn-success" onclick="handleAddWord('${categoryId}')">Добавить слово</button>
                <button class="btn btn-outline mt-8" onclick="closeModal(); showImportWordsModal('${categoryId}')">📤 Загрузить списком</button>
            `);
        }

        function handleAddWord(categoryId) {
            const original = document.getElementById('new-word-original').value.trim();
            const translation = document.getElementById('new-word-translation').value.trim();
            const transcription = document.getElementById('new-word-transcription').value.trim();
            if (!original || !translation) { showToast('Заполните слово и перевод'); return; }
            addWord(categoryId, original, translation, transcription);
            closeModal();
        }

        function showImportWordsModal(categoryId) {
            showModal(`
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center; margin-bottom:16px;">📤 Загрузка слов списком</h3>
                <p class="text-center">Введите слова в формате:</p>
                <p class="text-center" style="background:#f0f0f0; padding:8px; border-radius:8px; font-size:14px;">cat, кошка, [kæt]</p>
                <div class="form-group">
                    <label>Список слов (каждое с новой строки)</label>
                    <textarea id="import-words-text" rows="6" style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:12px; font-size:14px; font-family:inherit;"></textarea>
                </div>
                <button class="btn btn-success" onclick="handleImportWords('${categoryId}')">Импортировать</button>
            `);
        }

        async function handleImportWords(categoryId) {
            const text = document.getElementById('import-words-text').value;
            if (!text.trim()) { showToast('Введите хотя бы одно слово'); return; }
            const lines = text.split('\n').filter(line => line.trim());
            let count = 0;
            for (const line of lines) {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length < 2) continue;
                const original = parts[0];
                const translation = parts[1];
                const transcription = parts[2] || '';
                if (original && translation) {
                    await addWord(categoryId, original, translation, transcription);
                    count++;
                }
            }
            closeModal();
            showToast(`✅ Импортировано ${count} слов`);
        }

        // ============================================================
        // 7. TOAST
        // ============================================================
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================================
        // 8. INIT
        // ============================================================
        checkSession().then(() => {
            renderApp();
            console.log('✅ Kids Words App готов!');
        });
    </script>
</body>
</html>
